name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Auto-release from conventional commits
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate before release
        run: |
          node tools/validate-pack.js
          node tools/test-cfx-refresh.js

      - name: Determine version bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" "${LAST_TAG}..HEAD")
          fi

          if [ -z "$COMMITS" ]; then
            echo "bump=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          BUMP="none"
          if echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE "^(fix|refactor|perf|docs|chore|test)(\(.+\))?:"; then
            BUMP="patch"
          fi
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP"

      - name: Compute new version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          CURRENT=$(node -p "require('./.claude-plugin/plugin.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          BUMP="${{ steps.bump.outputs.bump }}"

          if [ "$BUMP" = "major" ]; then
            NEW="$((MAJOR+1)).0.0"
          elif [ "$BUMP" = "minor" ]; then
            NEW="${MAJOR}.$((MINOR+1)).0"
          else
            NEW="${MAJOR}.${MINOR}.$((PATCH+1))"
          fi
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "New version: $NEW (was $CURRENT)"

      - name: Update plugin.json version
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const path = '.claude-plugin/plugin.json';
            const p = JSON.parse(fs.readFileSync(path, 'utf8'));
            p.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
            console.log('Updated to', process.argv[1]);
          " "$VERSION"

      - name: Build release notes
        id: notes
        if: steps.bump.outputs.bump != 'none'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "${LAST_TAG}..HEAD")
          fi

          {
            echo "notes<<NOTES_EOF"
            echo "## Changes"
            echo ""
            echo "$LOG"
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit and tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Create GitHub release
        if: steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}"
